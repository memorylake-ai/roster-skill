<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #f5f6f8; --surface: #ffffff; --sunken: #eceef2; --text: #15181e; --text-2: #535a66; --text-3: #8e95a2;
    --hair: #e2e5ea; --hair-2: #d5d9e0; --primary: #15181e; --on-primary: #ffffff;
    --brand: #1f5ad6; --brand-2: #3370eb; --brand-soft: rgba(51, 112, 235, .14); --green: #2f8a5e; --amber: #b07612;
    --dot: rgba(21, 24, 30, .10); --shadow: 0 1px 2px rgba(21,24,30,.06), 0 8px 24px rgba(21,24,30,.07);
    --glow: radial-gradient(closest-side, rgba(51,112,235,.22), rgba(51,112,235,0));
    --tile-a: linear-gradient(135deg, #3370eb, #1f5ad6); --tile-b: linear-gradient(135deg, #22b8cf, #0b7a8f); --tile-c: linear-gradient(135deg, #7c6cf2, #4f46c8);
  }
  .dark {
    --canvas: #0d0f13; --surface: #15181e; --sunken: #1b1f26; --text: #eceef2; --text-2: #b8bec8; --text-3: #666d7a;
    --hair: #272c35; --hair-2: #30353f; --primary: #eceef2; --on-primary: #15181e;
    --brand: #8db4fb; --brand-2: #5b8ef2; --brand-soft: rgba(91, 142, 242, .16); --green: #4fae80; --amber: #e0a849;
    --dot: rgba(236, 238, 242, .09); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    --glow: radial-gradient(closest-side, rgba(91,142,242,.28), rgba(91,142,242,0));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 400px; }
  body { background: var(--canvas); font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  #stage { position: relative; width: 1280px; height: 400px; overflow: hidden; }

  /* 背景：右侧点阵（向左淡出）与品牌蓝光晕 */
  .dots { position: absolute; inset: 0; background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); background-size: 18px 18px;
          -webkit-mask-image: linear-gradient(90deg, transparent 32%, #000 62%); mask-image: linear-gradient(90deg, transparent 32%, #000 62%); }
  .glow { position: absolute; width: 560px; height: 560px; left: 640px; top: -80px; background: var(--glow); filter: blur(6px); }

  /* 左侧文字 */
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brandrow { display: flex; align-items: center; gap: 10px; color: var(--text); font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
  .mark { width: 30px; height: 30px; display: inline-grid; place-items: center; color: inherit; }
  .mark .mk { width: 100%; height: 100%; display: block; }
  .sep { width: 1px; height: 16px; background: var(--hair-2); }
  .eyebrow { font-size: 13px; font-weight: 500; color: var(--text-3); letter-spacing: .02em; }
  h1 { margin-top: 22px; font-size: 60px; line-height: 1; font-weight: 700; letter-spacing: -.035em; }
  h1 span { color: var(--brand); }
  .sub { margin-top: 18px; font-size: 18px; line-height: 1.5; color: var(--text-2); letter-spacing: -.005em; max-width: 470px; }
  .cmd { margin-top: 26px; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; height: 38px; padding: 0 14px;
         border-radius: 10px; background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow);
         font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; color: var(--text-2); }
  .cmd b { color: var(--brand); font-weight: 500; }
  .cmd i { width: 7px; height: 15px; background: var(--brand); border-radius: 1px; }

  /* 右侧：桌面端窗口的抽象 */
  .win { position: absolute; left: 640px; top: 36px; width: 600px; height: 328px; border-radius: 18px; border: 1px solid var(--hair);
         background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 70%, transparent), color-mix(in srgb, var(--surface) 30%, transparent)); }
  .lights { position: absolute; left: 18px; top: 16px; display: flex; gap: 7px; }
  .lights span { width: 10px; height: 10px; border-radius: 50%; background: var(--hair-2); }
  .rail { position: absolute; left: 18px; top: 50px; width: 74px; display: flex; flex-direction: column; gap: 9px; }
  .rail span { height: 8px; border-radius: 4px; background: var(--sunken); }
  .rail span.on { background: var(--brand-soft); }

  svg.links { position: absolute; inset: 0; }

  .tile { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow);
          border: 1px solid var(--hair); display: grid; place-items: center; }
  .tile img { width: 24px; height: 24px; display: block; }
  .tile .oc { border-radius: 4px; }
  .dark .tile .oc { background: #eceef2; padding: 1px; }
  .tile img.light-only { display: block; } .tile img.dark-only { display: none; }
  .dark .tile img.light-only { display: none; } .dark .tile img.dark-only { display: block; }

  .core { position: absolute; left: 860px; top: 156px; width: 88px; height: 88px; border-radius: 24px; background: var(--primary);
          box-shadow: 0 0 0 10px var(--brand-soft), var(--shadow); display: grid; place-items: center; color: var(--on-primary); }
  .core .mark { width: 50px; height: 50px; }

  .emp { position: absolute; border-radius: 14px; box-shadow: var(--shadow); display: grid; place-items: center; color: #fff; }
  .emp svg { width: 22px; height: 22px; }
  .emp::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 50%;
                background: var(--green); border: 2.5px solid var(--canvas); }
  .label { position: absolute; font-size: 11.5px; font-weight: 500; color: var(--text-3); white-space: nowrap; transform: translateX(-50%); }

  .chip { position: absolute; display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 8px;
          background: var(--surface); border: 1px solid var(--hair); box-shadow: var(--shadow); font-size: 12px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
  .chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .chip.mono { font-family: "Geist Mono", ui-monospace, monospace; font-weight: 400; }
  .chip .tag { padding: 1px 6px; border-radius: 4px; background: var(--sunken); color: var(--green); font-size: 11px; }
</style>
</head>
<body>
<div id="stage">

</div>

</html>
