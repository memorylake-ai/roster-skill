name: contract
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 技能里的 rosterctl 命令与参数都在契约里
        run: node scripts/check-contract.mjs
      - name: 插件清单是合法 JSON
        run: |
          node -e 'for (const f of [".claude-plugin/plugin.json", ".claude-plugin/marketplace.json", ...require("fs").readdirSync("contracts").map(x => "contracts/" + x)]) JSON.parse(require("fs").readFileSync(f, "utf8"))'
